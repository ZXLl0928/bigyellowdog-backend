services:
  - type: web
    name: bigyellowdog-api
    runtime: node
    plan: free
    region: oregon          # 可改 singapore / frankfurt，离国内近选 singapore
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: "3000"
      - key: ALLOW_ORIGINS
        # 允许前端跨域访问。把你的 Netlify 地址填进去，多个用逗号分隔；开发时可临时用 *
        value: "https://bigyellowdog.netlify.app"
      - key: JWT_SECRET
        # 部署后 Render 会自动生成随机值；首次部署可删掉这行让它自动生成
        generateValue: true
      - key: DATA_DIR
        value: "./data"
